# ── Demo / H2 Profile ────────────────────────────────────────────────────────
# Used when SPRING_PROFILES_ACTIVE=demo
# Runs entirely in-memory with H2 — no MySQL needed.
# Data is lost on restart. For demo/testing purposes only.
spring:
  config:
    activate:
      on-profile: demo

  datasource:
    url: jdbc:h2:mem:arecaharvest;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE,YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false          # H2 uses JPA DDL — Flyway migrations are MySQL-specific

  h2:
    console:
      enabled: true
      path: /h2-console    # Accessible at http://localhost:8080/h2-console

logging:
  level:
    com.arecaharvest: INFO
