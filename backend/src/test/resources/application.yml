spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false   # Use JPA DDL in tests

jwt:
  secret: test_secret_key_for_unit_tests_only_64_characters_long_placeholder
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

app:
  cors:
    allowed-origins: http://localhost:5173
  pagination:
    default-page-size: 20
    max-page-size: 100

